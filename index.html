
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mephisto</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
    }

    body {
        display: flex;
        justify-content: center;
    }

    .page {
        width: 100%;
        max-width: 302px;
        min-height: 640px;
        padding-top: 70px;
        text-align: center;
        position: relative;
    }

    /* LOGO */
    .logo {
        color: #1877f2;
        font-size: 27px;
        line-height: 32px;
        font-weight: 700;
        letter-spacing: -1.2px;
        margin-bottom: 29px;
    }

    /* FORM */
    .login-box {
        width: 100%;
    }

    .input {
        width: 100%;
        height: 33px;
        border: none;
        outline: none;
        background: #f7eeee;
        border-radius: 8px;
        padding: 0 14px;
        font-size: 11px;
        color: #555;
        margin-bottom: 5px;
    }

    .input::placeholder {
        color: #8b8b8b;
        opacity: 1;
    }

    .input:focus {
        background: #f3e9e9;
    }

    /* SUBMIT BUTTON */
    .login-btn {
        width: 100%;
        height: 34px;
        margin-top: 15px;
        border: none;
        border-radius: 7px;
        background: #0d39ed;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s ease;
    }

    .login-btn:hover {
        opacity: 0.9;
    }

    .login-btn:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    /* MESSAGE */
    .message {
        min-height: 16px;
        margin-top: 10px;
        font-size: 11px;
        line-height: 16px;
    }

    .success {
        color: #08a51b;
    }

    .error {
        color: #d00000;
    }

    /* LINK */
    .forgot {
        display: block;
        margin-top: 15px;
        color: #3978e8;
        font-size: 12px;
        text-decoration: none;
    }

    /* OR */
    .or-section {
        display: flex;
        align-items: center;
        width: 100%;
        margin-top: 27px;
        margin-bottom: 26px;
    }

    .line {
        height: 1px;
        background: #999;
        flex: 1;
    }

    .or {
        font-size: 13px;
        color: #333;
        padding: 0 10px;
    }

    /* CREATE BUTTON */
    .create-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        height: 32px;
        padding: 0 15px;

        background: #08a51b;
        color: white;

        font-size: 14px;
        font-weight: 700;

        border: none;
        cursor: default;
    }

    /* FOOTER */
    .footer {
        position: absolute;
        left: 0;
        right: 0;
        top: 492px;
        text-align: center;
    }

    .footer-links {
        display: flex;
        justify-content: center;
        gap: 19px;
    }

    .footer-links span {
        font-size: 11px;
        color: #333;
    }

    .meta {
        margin-top: 26px;
        font-size: 12px;
        color: #777;
    }

    .meta-symbol {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        width: 15px;
        height: 15px;

        border: 1px solid #777;
        border-radius: 50%;

        font-size: 10px;
        font-weight: 700;

        margin: 0 2px;
    }

    /* MOBILE */
    @media (max-width: 350px) {
        .page {
            max-width: 302px;
            padding-left: 0;
            padding-right: 0;
        }
    }
</style>
</head>

<body>

<div class="page">

    <!-- MEPhISTO BRAND -->
    <div class="logo">Mephisto</div>

    <div class="login-box">

        <!-- USERNAME -->
        <input
            class="input"
            id="username"
            type="text"
            maxlength="50"
            autocomplete="off"
            placeholder="Username"
        >

        <!-- COMMENT -->
        <input
            class="input"
            id="comment"
            type="text"
            maxlength="500"
            autocomplete="off"
            placeholder="Comment"
        >

        <!-- SUBMIT -->
        <button
            class="login-btn"
            id="submitBtn"
            type="button"
        >
            Submit
        </button>

        <!-- STATUS -->
        <div
            id="message"
            class="message"
            aria-live="polite"
        ></div>

        <a
            class="forgot"
            href="javascript:void(0)"
        >
            Share your feedback
        </a>

        <!-- OR -->
        <div class="or-section">
            <div class="line"></div>
            <div class="or">or</div>
            <div class="line"></div>
        </div>

        <!-- GREEN BUTTON -->
        <button
            class="create-btn"
            type="button"
        >
            Leave a Comment
        </button>

    </div>

    <!-- FOOTER -->
    <div class="footer">

        <div class="footer-links">
            <span>About</span>
            <span>Help</span>
            <span>More</span>
        </div>

        <div class="meta">
            Meta
            <span class="meta-symbol">C</span>
            2022
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://xckazgcqquiyidpbyrag.supabase.co";

const SUPABASE_KEY =
    "sb_publishable__Qd77vJxvs8xUK6_ZA6eag_9wSXWRR6";


/* =========================================================
   CREATE SUPABASE CLIENT
========================================================= */

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GET ELEMENTS
========================================================= */

const usernameInput =
    document.getElementById("username");

const commentInput =
    document.getElementById("comment");

const submitBtn =
    document.getElementById("submitBtn");

const message =
    document.getElementById("message");


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;
}


/* =========================================================
   SUBMIT COMMENT
========================================================= */

async function submitComment() {

    const username =
        usernameInput.value.trim();

    const comment =
        commentInput.value.trim();


    /* Clear old message */

    message.textContent = "";
    message.className = "message";


    /* Validate username */

    if (!username) {

        showMessage(
            "Please enter your username.",
            "error"
        );

        usernameInput.focus();

        return;
    }


    /* Validate comment */

    if (!comment) {

        showMessage(
            "Please enter your comment.",
            "error"
        );

        commentInput.focus();

        return;
    }


    /* Disable button */

    submitBtn.disabled = true;

    submitBtn.textContent = "Sending...";


    try {

        /* Send data to Supabase */

        const { error } = await supabaseClient
            .from("comments")
            .insert([
                {
                    username: username,
                    comment: comment
                }
            ]);


        /* Handle error */

        if (error) {

            console.error(
                "Supabase Error:",
                error
            );

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            return;
        }


        /* Success */

        showMessage(
            "Comment submitted successfully!",
            "success"
        );


        /* Clear inputs */

        usernameInput.value = "";
        commentInput.value = "";


    } catch (error) {

        console.error(
            "Unexpected Error:",
            error
        );

        showMessage(
            "Unable to submit comment.",
            "error"
        );

    } finally {

        /* Enable button */

        submitBtn.disabled = false;

        submitBtn.textContent = "Submit";
    }
}


/* =========================================================
   BUTTON CLICK
========================================================= */

submitBtn.addEventListener(
    "click",
    submitComment
);


/* =========================================================
   ENTER KEY SUPPORT
========================================================= */

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            commentInput.focus();
        }
    }
);


commentInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            submitComment();
        }
    }
);

</script>

</body>
</html>
```
